<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayesha's Birthday Hangman ❤️</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ffe4f1, #eee1ff);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #241b2f;
    }

    .game-container {
        width: 100%;
        max-width: 900px;
        background: rgba(255,255,255,0.95);
        border-radius: 25px;
        padding: 25px;
        box-shadow: 0 20px 60px rgba(80,30,80,0.18);
    }

    .title {
        text-align: center;
    }

    .title p {
        color: #806d7e;
    }

    /* Progress */

    .progress-container {
        height: 10px;
        background: #f1e5ed;
        border-radius: 20px;
        overflow: hidden;
        margin: 20px 0;
    }

    .progress {
        height: 100%;
        width: 10%;
        background: linear-gradient(90deg, #ec4899, #8b5cf6);
        transition: width 0.4s;
    }

    /* Game */

    .game {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 25px;
        align-items: center;
    }

    /* Hangman */

    .hangman-box {
        min-height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff8fc;
        border: 1px solid #efdce8;
        border-radius: 20px;
    }

    svg {
        width: 260px;
        height: 280px;
    }

    .hangman-part {
        opacity: 0;
        transition: opacity 0.3s;
    }

    .hangman-part.show {
        opacity: 1;
    }

    /* Question */

    .question {
        font-size: 19px;
        font-weight: bold;
        line-height: 1.5;
    }

    .hint {
        margin-top: 7px;
        font-size: 14px;
        color: #8b7786;
    }

    /* Word */

    .word {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 25px 0;
        min-height: 45px;
    }

    .letter {
        width: 32px;
        height: 42px;
        border-bottom: 3px solid #d5a5c5;
        text-align: center;
        font-size: 26px;
        font-weight: bold;
    }

    .space {
        border-bottom: none;
        width: 15px;
    }

    /* Wrong guesses */

    .wrong {
        color: #c02667;
        font-weight: bold;
        margin-bottom: 12px;
    }

    /* Keyboard */

    .keyboard {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 7px;
    }

    .key {
        min-height: 45px;
        border: 1px solid #ead8e4;
        background: white;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
        font-size: 15px;
        transition: 0.2s;
    }

    .key:hover:not(:disabled) {
        background: #ffe4f1;
        transform: translateY(-2px);
    }

    .key:disabled {
        opacity: 0.35;
        cursor: not-allowed;
    }

    /* Status */

    .status {
        min-height: 25px;
        margin-top: 15px;
        font-weight: bold;
    }

    /* Next */

    .next-button {
        display: none;
        width: 100%;
        margin-top: 15px;
        padding: 13px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(90deg, #ec4899, #8b5cf6);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    /* Final */

    .final {
        display: none;
        text-align: center;
        padding: 30px 10px;
    }

    .final .heart {
        font-size: 65px;
    }

    .final h2 {
        font-size: 30px;
    }

    .restart {
        padding: 13px 25px;
        border: none;
        border-radius: 12px;
        background: #241b2f;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    html.embedded body {
        min-height: 100%;
        padding: 6px;
        display: block;
        background: linear-gradient(135deg, #fff7fa, #f7e8ec);
    }

    html.embedded .game-container {
        max-width: none;
        padding: 4px;
        background: transparent;
        border-radius: 0;
        box-shadow: none;
    }

    html.embedded .progress-container {
        margin: 8px 0;
    }

    html.embedded .game {
        gap: 10px;
    }

    html.embedded .word {
        margin: 10px 0;
    }

    html.embedded .title p {
        margin: 0 0 8px;
    }

    html.embedded .key {
        min-height: 40px;
    }

    /* Mobile */

    @media (max-width: 700px) {

        .game {
            grid-template-columns: 1fr;
        }

        .hangman-box {
            min-height: 210px;
        }

        .hangman-box svg {
            width: min(210px, 100%);
            height: 220px;
        }

        html.embedded .hangman-box {
            min-height: 180px;
        }

        .keyboard {
            grid-template-columns: repeat(6, 1fr);
        }

    }

    @media (max-width: 400px) {

        .game-container {
            padding: 16px;
        }

        .keyboard {
            grid-template-columns: repeat(5, 1fr);
        }

        .key {
            min-height: 43px;
        }
    }
</style>
</head>

<body>

<div class="game-container">

    <!-- TITLE -->

    <div class="title">
        <p>Find the hidden words and survive all 10 questions ❤️</p>
    </div>

    <!-- PROGRESS -->

    <div class="progress-container">
        <div class="progress" id="progress"></div>
    </div>

    <!-- GAME -->

    <div id="gameArea">

        <div class="game">

            <!-- HANGMAN -->

            <div class="hangman-box">

                <svg viewBox="0 0 260 280">

                    <!-- Gallows -->

                    <path
                        d="M30 250 H230
                           M60 250 V25
                           M60 25 H180
                           M180 25 V55"
                        fill="none"
                        stroke="#5b4757"
                        stroke-width="7"
                        stroke-linecap="round"
                    />

                    <!-- Head -->

                    <circle
                        id="part1"
                        class="hangman-part"
                        cx="180"
                        cy="80"
                        r="25"
                        fill="none"
                        stroke="#c02667"
                        stroke-width="6"
                    />

                    <!-- Body -->

                    <path
                        id="part2"
                        class="hangman-part"
                        d="M180 105 V170"
                        fill="none"
                        stroke="#c02667"
                        stroke-width="6"
                        stroke-linecap="round"
                    />

                    <!-- Left Arm -->

                    <path
                        id="part3"
                        class="hangman-part"
                        d="M180 120 L140 145"
                        fill="none"
                        stroke="#c02667"
                        stroke-width="6"
                        stroke-linecap="round"
                    />

                    <!-- Right Arm -->

                    <path
                        id="part4"
                        class="hangman-part"
                        d="M180 120 L220 145"
                        fill="none"
                        stroke="#c02667"
                        stroke-width="6"
                        stroke-linecap="round"
                    />

                    <!-- Left Leg -->

                    <path
                        id="part5"
                        class="hangman-part"
                        d="M180 170 L145 215"
                        fill="none"
                        stroke="#c02667"
                        stroke-width="6"
                        stroke-linecap="round"
                    />

                    <!-- Right Leg -->

                    <path
                        id="part6"
                        class="hangman-part"
                        d="M180 170 L215 215"
                        fill="none"
                        stroke="#c02667"
                        stroke-width="6"
                        stroke-linecap="round"
                    />

                </svg>

            </div>

            <!-- QUESTION AREA -->

            <div>

                <div class="question" id="question"></div>

                <div class="hint">
                    💡 Every wrong letter adds another part to the hangman.
                </div>

                <!-- WORD -->

                <div class="word" id="word"></div>

                <!-- WRONG -->

                <div class="wrong" id="wrong">
                    Wrong guesses: 0 / 6
                </div>

                <!-- KEYBOARD -->

                <div class="keyboard" id="keyboard"></div>

                <!-- STATUS -->

                <div class="status" id="status"></div>

                <!-- NEXT -->

                <button
                    class="next-button"
                    id="nextButton">
                    Next Question ❤️
                </button>

            </div>

        </div>

    </div>

    <!-- FINAL SCREEN -->

    <div class="final" id="finalScreen">

        <div class="heart">
            🎁💗
        </div>

        <h2>You completed all 10! 🎉</h2>

        <p>
            You made it through all 10 questions, Ayesha.
            <br>
            Now your final birthday surprise is unlocked. ❤️
        </p>

        <button
            class="restart"
            id="restartButton">
            Play Again
        </button>

    </div>

</div>


<script>

const isEmbeddedGame = new URLSearchParams(window.location.search).has("embed");
if (isEmbeddedGame) {
    document.documentElement.classList.add("embedded");
}

/* =========================================================
   QUESTIONS & ANSWERS
   =========================================================
   
   Change these 10 questions and answers for Ayesha.

   IMPORTANT:
   Answers should contain only letters/spaces.
   Example:
   answer: "COFFEE"
   answer: "OUR MEMORIES"

========================================================= */

const questions = [

    {
        question: "What do I call the person who makes my heart happiest?",
        answer: "LOVE"
    },

    {
        question: "What is the one word I would use to describe you?",
        answer: "BEAUTIFUL"
    },

    {
        question: "What I always want to do with you?",
        answer: "NIKKAH"
    },

    {
        question: "What do I feel whenever I see your smile?",
        answer: "HAPPINESS"
    },

    {
        question: "What is something I want us to create together?",
        answer: "MEMORIES"
    },

    {
        question: "What do I want to do when we are walking together?",
        answer: "HOLDING HANDS"
    },

    {
        question: "What little thing from you can instantly brighten my day?",
        answer: "SMILE"
    },

    {
        question: "What is the name of the person who means the world to me?",
        answer: "AYESHA"
    },

    {
        question: "What do I want our story to be full of?",
        answer: "LOVE"
    },

    {
        question: "When we feel lovely? When we are ______ ?",
        answer: "TOGETHER"
    },

    {
        question: "What happened behind St. Joseph’s School?",
        answer: "FIRST MEETING"
    },

    {
        question: "In which month is Ayesha’s birthday?",
        answer: "SEPTEMBER"
    },

    {
        question: "Where did we have our first date, marking the beginning of so many beautiful memories?",
        answer: "KFC"
    },

    {
        question: "Where did we go for our first movie date, creating a memory that will always have a special place in our story?",
        answer: "HIND FAME"
    },

    {
        question: "What did we do together at SKY NOIR CAFÉ?",
        answer: "BIRTHDAY CELEBRATION"
    },

    {
        question: "Where did we have our simple meeting near College Square?",
        answer: "PARAMOUNT"
    },

    {
        question: "Where did you go for an evening walk when you were in Central?",
        answer: "COLLEGE SQUARE"
    },

    {
        question: "Where did we have our first meeting over food at Central Avenue?",
        answer: "FOOD STATION"
    },

    {
        question: "Where did we first walk together while holding hands and making simple moments special?",
        answer: "JATIN DAS PARK"
    },

    {
        question: "At which university’s back gate did we meet and walk together?",
        answer: "CALCUTTA UNIVERSITY"
    },

    {
        question: "Where did we go for our first date together near Rabindra Sadan?",
        answer: "HALDIRAM EXIDE"
    },

    {
        question: "Which Haldiram outlet did we visit together in January 2026?",
        answer: "MANICKTALA"
    },

    {
        question: "What did we have near Manicktala while walking towards Girish Park?",
        answer: "PANI PURI"
    },

    {
        question: "Where did we go shopping together on Park Street?",
        answer: "ZUDIO"
    },

    {
        question: "Which mall did we visit in Kalighat?",
        answer: "LAKE MALL"
    },

    {
        question: "What was the name of your childhood school where you studied?",
        answer: "LORETO BOWBAZAR"
    },

    {
        question: "Where did we go for a lunch date together, where we ordered only vegetarian food?",
        answer: "AIR CASA"
    },

    {
        question: "What did you have after the gym while it was lightly drizzling?",
        answer: "WAFFLES"
    },

    {
        question: "Where did we have our first South Indian food together?",
        answer: "IDLYGO"
    },

    {
        question: "Where did we spend so much time together on the metro, making an ordinary moment feel special?",
        answer: "NETAJI BHAVAN"
    },

    {
        question: "Where did we sit together, talk, and enjoy some food in Salt Lake?",
        answer: "OMG CAFE"
    }

];

const QUESTIONS_PER_GAME = 10;


/* =========================================================
   GAME VARIABLES
========================================================= */

let questionOrder = [];

let currentQuestion = 0;

let currentWord = "";

let guessedLetters = new Set();

let wrongGuesses = 0;

let gameLocked = false;


/* =========================================================
   ELEMENTS
========================================================= */

const questionElement =
    document.getElementById("question");

const wordElement =
    document.getElementById("word");

const keyboardElement =
    document.getElementById("keyboard");

const wrongElement =
    document.getElementById("wrong");

const statusElement =
    document.getElementById("status");

const nextButton =
    document.getElementById("nextButton");

const progressElement =
    document.getElementById("progress");

const gameArea =
    document.getElementById("gameArea");

const finalScreen =
    document.getElementById("finalScreen");

const restartButton =
    document.getElementById("restartButton");


/* =========================================================
   SHUFFLE QUESTIONS
========================================================= */

function shuffleQuestions(array) {
    const shuffled = [...array];
    for (let index = shuffled.length - 1; index > 0; index--) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
    }
    return shuffled;
}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    questionOrder =
        shuffleQuestions(questions).slice(0, QUESTIONS_PER_GAME);

    currentQuestion = 0;

    gameArea.style.display = "block";

    finalScreen.style.display = "none";

    loadQuestion();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion() {

    const data =
        questionOrder[currentQuestion];

    currentWord =
        data.answer.toUpperCase();

    guessedLetters =
        new Set();

    wrongGuesses = 0;

    gameLocked = false;


    questionElement.textContent =
        `Question ${currentQuestion + 1}/${questionOrder.length} — ${data.question}`;


    wrongElement.textContent =
        "Wrong guesses: 0 / 6";


    statusElement.textContent = "";

    statusElement.style.color = "";


    nextButton.style.display = "none";


    /* Progress */

    const progress =
        ((currentQuestion + 1) / questionOrder.length) * 100;

    progressElement.style.width =
        progress + "%";


    /* Reset hangman */

    for (let i = 1; i <= 6; i++) {

        document
            .getElementById("part" + i)
            .classList.remove("show");

    }


    renderWord();

    createKeyboard();

}


/* =========================================================
   DISPLAY WORD
========================================================= */

function renderWord() {

    wordElement.innerHTML = "";


    for (const letter of currentWord) {

        const element =
            document.createElement("div");


        if (letter === " ") {

            element.className =
                "letter space";

        } else {

            element.className =
                "letter";


            if (guessedLetters.has(letter)) {

                element.textContent =
                    letter;

            }

        }


        wordElement.appendChild(element);

    }

}


/* =========================================================
   CREATE KEYBOARD
========================================================= */

function createKeyboard() {

    keyboardElement.innerHTML = "";


    const letters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";


    for (const letter of letters) {

        const button =
            document.createElement("button");


        button.className =
            "key";

        button.textContent =
            letter;

        button.type =
            "button";


        button.disabled =
            guessedLetters.has(letter) ||
            gameLocked;


        button.addEventListener(
            "click",
            () => guessLetter(letter)
        );


        keyboardElement.appendChild(button);

    }

}


/* =========================================================
   GUESS LETTER
========================================================= */

function guessLetter(letter) {

    if (gameLocked)
        return;


    if (guessedLetters.has(letter))
        return;


    guessedLetters.add(letter);


    /* Correct */

    if (currentWord.includes(letter)) {

        renderWord();

        checkWin();

    }

    /* Wrong */

    else {

        wrongGuesses++;


        /* Show next hangman part */

        if (wrongGuesses <= 6) {

            document
                .getElementById(
                    "part" + wrongGuesses
                )
                .classList.add("show");

        }


        wrongElement.textContent =
            `Wrong guesses: ${wrongGuesses} / 6`;


        if (wrongGuesses >= 6) {

            gameOver();

        }

    }


    createKeyboard();

}

document.addEventListener("keydown", event => {
    const letter = event.key.toUpperCase();
    if (/^[A-Z]$/.test(letter) && gameArea.style.display !== "none") {
        guessLetter(letter);
    }
});


/* =========================================================
   CHECK WIN
========================================================= */

function checkWin() {

    const completed =
        [...currentWord].every(letter => {

            if (letter === " ")
                return true;

            return guessedLetters.has(letter);

        });


    if (completed) {

        gameLocked = true;


        statusElement.textContent =
            "🎉 Correct! You found the word!";

        statusElement.style.color =
            "#15803d";


        nextButton.style.display =
            "block";


        if (currentQuestion === questionOrder.length - 1) {

            nextButton.textContent =
                "🎁 Reveal Birthday Surprise";

        } else {

            nextButton.textContent =
                "Next Question ❤️";

        }


        createKeyboard();

    }

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver() {

    gameLocked = true;


    /* Reveal answer */

    renderWord();

    for (const letter of currentWord) {

        guessedLetters.add(letter);

    }

    renderWord();


    statusElement.textContent =
        `💔 The word was "${currentWord}".`;


    statusElement.style.color =
        "#c02667";


    nextButton.style.display =
        "block";


    if (currentQuestion === questionOrder.length - 1) {

        nextButton.textContent =
            "🎁 Finish Game";

    } else {

        nextButton.textContent =
            "Try Next Question";

    }


    createKeyboard();

}


/* =========================================================
   NEXT QUESTION
========================================================= */

nextButton.addEventListener(
    "click",
    () => {

        if (currentQuestion === questionOrder.length - 1) {

            /* All 10 finished */

            gameArea.style.display =
                "none";

            finalScreen.style.display =
                "block";

            progressElement.style.width =
                "100%";

        } else {

            currentQuestion++;

            loadQuestion();

        }

    }
);


/* =========================================================
   RESTART
========================================================= */

restartButton.addEventListener(
    "click",
    () => {

        startGame();

    }
);


/* =========================================================
   START
========================================================= */

startGame();

if (isEmbeddedGame && "ResizeObserver" in window) {
    const gameContainer = document.querySelector(".game-container");
    const reportEmbeddedHeight = () => {
        const height = Math.ceil(gameContainer.getBoundingClientRect().height + 24);
        window.parent.postMessage({ type: "hangman:resize", height }, "*");
    };
    const heightObserver = new ResizeObserver(reportEmbeddedHeight);
    heightObserver.observe(gameContainer);
}

</script>

</body>
</html>
